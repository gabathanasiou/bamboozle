name = "bamboozle-rooms"
main = "src/index.ts"
compatibility_date = "2026-10-22"

# Separate Worker and Durable Object namespace from Lemon Schedule. Do not reuse
# lemon-rooms names, ids, secrets or code.

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "BambooRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BambooRoom", "Directory"]

[[kv_namespaces]]
binding = "TTS_KV"
id = "dd08b2aa23444472b24cb3b83899df13"

[vars]
AUTH_MODE = "none"
GCS_BUCKET_NAME = "bamboozle-audio-assets"
ALLOWED_ORIGINS = "https://bamboozlegame.netlify.app,https://*--bamboozlegame.netlify.app,http://localhost:*,http://127.0.0.1:*,capacitor://localhost,https://localhost,http://localhost"
HOST_GRACE_MS = "60000"
PLAYER_KICK_MS = "60000"
EMPTY_ROOM_MS = "60000"
TTS_DAILY_CHARS = "50000"
TTS_IP_DAILY_CHARS = "5000"
MAX_SOCKETS_PER_IP = "32"
MAX_SOCKETS_TOTAL = "1000"
MAX_UPGRADES_PER_MINUTE = "30"
MAX_CREATES_PER_HOUR = "10"
MAX_TOTAL_ROOMS = "500"
MAX_PLAYERS_PER_ROOM = "6"
MAX_AUDIENCE_PER_ROOM = "20"
MAX_STATE_BYTES = "131072"

[observability]
enabled = true
